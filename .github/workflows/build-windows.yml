name: Build Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # 1. Download your repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install x64 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      # 3. Confirm we're actually using x64 Python
      - name: Check Python architecture
        run: |
          python -c "import sys, platform; print('Python:', sys.version); print('Architecture:', platform.machine()); print('Executable:', sys.executable)"

      # 4. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 5. Install your Python dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 6. Install PyInstaller
      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      # 7. Build the application
      - name: Build application
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed main.py

      # 8. Upload the resulting EXE
      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: VPNApp-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
